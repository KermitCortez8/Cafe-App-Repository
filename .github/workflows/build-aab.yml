name: Build Exp Android AAB

on:
  push:
    branches:
      - feature/deploy-monitoring  
 
jobs:
  build:
    runs-on: ubuntu-latest  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'   

      - name: Install Yarn
        run: npm install -g yarn   

      - name: Install dependencies
        run: |
          cd InfoCafe-2  
          yarn add expo  
          npx expo install 

      - name: Install Expo CLI and EAS CLI
        run: |
          npm install -g expo-cli  # Instalar Expo CLI
          npm install -g eas-cli  # Instalar EAS CLI

      - name: Log in to Expo (EAS Token)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}   
        run: |
          echo "Logging in to Expo with token..."
          eas whoami || eas login --token $EXPO_TOKEN  # Login a Expo con el token

      - name: Build the AAB using the "preview" profile
        env:
          EAS_BUILD_PROFILE: preview   
    
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}   
        run: |
          cd InfoCafe-2
          eas whoami || eas login --token $EXPO_TOKEN
          echo "GOOGLE_MAPS_KEY=${{ secrets.GOOGLE_MAPS_KEY }}" >> $GITHUB_ENV   
          echo "EXPO_TOKEN=${{ secrets.EXPO_TOKEN }}" >> $GITHUB_ENV   
          eas build --platform android --profile $EAS_BUILD_PROFILE --non-interactive   
