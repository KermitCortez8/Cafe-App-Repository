name: Build Expo Android AAB

on:
  push:
    branches:
      - main # Se activará cuando haya un push a la rama "main"
 
jobs:
  build:
    runs-on: ubuntu-latest  # Usamos un entorno Linux para ejecutar el flujo de trabajo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js (version 14)
        uses: actions/setup-node@v3
        with:
          node-version: '20'  # Usa la versión de Node.js que prefieras

      - name: Install Yarn
        run: npm install -g yarn  # Instalar Yarn si no está disponible

      - name: Install dependencies
        run: |
          cd InfoCafe-2  
          yarn add expo  
          npx expo install 

      - name: Install Expo CLI and EAS CLI
        run: |
          npm install -g expo-cli  # Instalar Expo CLI
          npm install -g eas-cli  # Instalar EAS CLI

      - name: Log in to Expo (EAS Token)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}  # Usar el token de Expo desde los secretos de GitHub
        run: |
          eas whoami || eas login --token $EXPO_TOKEN  # Login a Expo con el token

      - name: Set up environment variables for build
        run: |
          echo "GOOGLE_MAPS_KEY=${{ secrets.GOOGLE_MAPS_KEY }}" >> $GITHUB_ENV  # Cargar la clave API desde los secretos

      - name: Build the AAB using the "preview" profile
        env:
          EAS_BUILD_PROFILE: preview  
        run: |
          eas build --platform android --profile $EAS_BUILD_PROFILE --non-interactive  # Ejecutar la build
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: https://play.google.com/console/developers/?pli=1  # Ruta del archivo .aab generado (ajusta si es necesario)
